query CartLinesDiscountsGenerateRunInput($eligibleCollectionIds: [ID!]! = []) {
  presentmentCurrencyRate
  cart {
    lines {
      id
      quantity
      sellingPlanAllocation { sellingPlan { id } }
      cost {
        amountPerQuantity { amount }
        subtotalAmount { amount }
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          product {
            id
            inEligibleCollection: inAnyCollection(ids: $eligibleCollectionIds)
          }
        }
      }
    }
  }
  discount {
    discountClasses
    metafield(namespace: "$app", key: "function-configuration") { jsonValue }
  }
}
